<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Dungeon</title>
    <style>
      :root {
        --fg: #33ff66;
        --dim: #1c8a3d;
        --bright: #b9ffcf;
        --bg: #05080a;
        --danger: #ff6b6b;
        --warn: #ffd166;
        --gold: #ffcf5f;
      }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Consolas", monospace;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .top {
        flex: 0 0 auto;
        padding: 8px 10px;
        border-bottom: 1px solid var(--dim);
      }
      .row { display: flex; justify-content: space-between; align-items: baseline; }
      .title { color: var(--bright); letter-spacing: 1px; }
      .loc { color: var(--dim); }
      .bars { padding: 8px 10px; flex: 0 0 auto; }
      .bar-label { display: flex; justify-content: space-between; margin-top: 4px; }
      .bar {
        height: 12px;
        background: rgba(255,255,255,0.07);
        border: 1px solid var(--dim);
        margin-top: 2px;
        position: relative;
        overflow: hidden;
      }
      .bar > span { display: block; height: 100%; transition: width 0.25s; }
      .bar.hp > span { background: var(--fg); }
      .bar.enemy > span { background: var(--danger); }
      .fx { color: var(--gold); font-size: 11px; margin-top: 3px; min-height: 1em; }
      .vs { text-align: center; color: var(--dim); margin: 6px 0 0; }
      /* Non-scrolling wrapper so the stats overlay stays put while the log
         scrolls inside it. */
      .logwrap {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
        display: flex;
        border-top: 1px solid var(--dim);
      }
      .log {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 8px 10px;
        white-space: pre-wrap;
      }
      .log div { margin: 1px 0; }
      .is-hit { color: var(--fg); }
      .is-crit { color: var(--warn); }
      .is-loot { color: var(--gold); }
      .is-bad { color: var(--danger); }
      .is-info { color: var(--dim); }
      .is-boss { color: var(--bright); }
      /* Stats overlay — toggled over the combat log. */
      .statspanel {
        position: absolute;
        inset: 0;
        display: none;
        overflow-y: auto;
        padding: 8px 10px;
        background: var(--bg);
      }
      .statspanel.show { display: block; }
      .sp-title { color: var(--bright); letter-spacing: 1px; margin-bottom: 4px; }
      .sp-row { display: grid; grid-template-columns: 68px 1fr 1fr; column-gap: 8px; line-height: 1.55; white-space: nowrap; }
      .sp-l { color: var(--dim); }
      .sp-p { color: var(--fg); text-align: right; }
      .sp-e { color: var(--danger); text-align: right; }
      .sp-row.head .sp-p, .sp-row.head .sp-e { color: var(--bright); }
      .controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--dim); }
      button {
        font-family: inherit; font-size: 12px;
        background: transparent; color: var(--fg);
        border: 1px solid var(--dim); border-radius: 3px;
        padding: 6px 10px; cursor: pointer;
      }
      button:hover { background: var(--fg); color: var(--bg); }
      .empty-hp { color: var(--dim); }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="row">
        <span class="title">ENDLESS DUNGEON</span>
        <span class="loc" id="loc">Floor 1 · Room 1</span>
      </div>
    </div>

    <div class="bars">
      <div class="bar-label"><span id="pname">You</span><span id="php">--/--</span></div>
      <div class="bar hp"><span id="pbar" style="width:100%"></span></div>
      <div class="fx" id="fx"></div>
      <div class="vs" id="vs">— entering the dungeon —</div>
      <div class="bar-label"><span id="ename">&nbsp;</span><span id="ehp">&nbsp;</span></div>
      <div class="bar enemy"><span id="ebar" style="width:0%"></span></div>
    </div>

    <div class="logwrap">
      <div class="log" id="log"></div>
      <div class="statspanel" id="statspanel"></div>
    </div>

    <div class="controls">
      <button id="statsbtn">Stats</button>
      <button id="restart">Restart at Floor 1</button>
      <button id="pause">Pause</button>
      <button id="close">Close</button>
    </div>

    <script src="til-sdk.js"></script>
    <script>
      // ---- Tunables ---------------------------------------------------------
      var ROOMS_PER_FLOOR = 6; // last room is the boss
      var CHEST_CHANCE = 0.22;
      var ENEMY_DROP_CHANCE = 0.35;
      var FLOOR_GROWTH = 0.15; // enemy stat multiplier grows 15% per floor
      var TURN_MS = 1000;
      var XP_PER_ENEMY = 10; // * floor
      var XP_PER_BOSS = 60; // * floor
      var MIN_HIT = 0.1; // dodge can never drop hit chance below 10%

      // ---- Enemy archetypes (base level-1 stats) ---------------------------
      var ENEMIES = [
        { name: 'Slime',    hp: 40, patt: 6,  matt: 0,  pdef: 2, mdef: 2, speed: 5,  acc: 90, dodge: 10, critRate: 2, critDmg: 150, luck: 1 },
        { name: 'Goblin',   hp: 50, patt: 9,  matt: 0,  pdef: 3, mdef: 2, speed: 9,  acc: 90, dodge: 18, critRate: 5, critDmg: 150, luck: 2 },
        { name: 'Bat',      hp: 30, patt: 7,  matt: 0,  pdef: 1, mdef: 1, speed: 14, acc: 90, dodge: 30, critRate: 8, critDmg: 150, luck: 3 },
        { name: 'Skeleton', hp: 60, patt: 11, matt: 0,  pdef: 5, mdef: 1, speed: 7,  acc: 90, dodge: 12, critRate: 5, critDmg: 150, luck: 1 },
        { name: 'Acolyte',  hp: 45, patt: 0,  matt: 12, pdef: 2, mdef: 5, speed: 8,  acc: 90, dodge: 15, critRate: 5, critDmg: 150, luck: 2 },
      ];
      var BOSSES = [
        { name: 'Ogre',       hp: 120, patt: 16, matt: 0,  pdef: 6, mdef: 4, speed: 6,  acc: 90, dodge: 12, critRate: 5,  critDmg: 160, luck: 3 },
        { name: 'Dark Mage',  hp: 100, patt: 0,  matt: 20, pdef: 4, mdef: 8, speed: 9,  acc: 90, dodge: 18, critRate: 8,  critDmg: 160, luck: 4 },
        { name: 'Dragonling', hp: 150, patt: 18, matt: 10, pdef: 8, mdef: 6, speed: 10, acc: 90, dodge: 22, critRate: 10, critDmg: 175, luck: 5 },
      ];

      // ---- State ------------------------------------------------------------
      var player = null; // { name, hp, maxhp, patt, ... }
      var floor = 1;
      var room = 1;
      var startFloorNum = 1; // floor to (re)start on; set at init, bumped by idle sim
      var combat = null; // { enemy, activeIsPlayer, isBoss }
      var paused = false;
      var loopTimer = null;
      var transitionTimer = null;

      var rand = function (n) { return Math.floor(Math.random() * n); };
      var pick = function (a) { return a[rand(a.length)]; };

      function el(id) { return document.getElementById(id); }
      function log(text, cls) {
        var d = document.createElement('div');
        d.className = 'll' + (cls ? ' ' + cls : ''); // 'll' marks a log line
        d.textContent = text;
        var box = el('log');
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        // Cap the number of log lines (leaving the stats overlay untouched).
        var lines = box.getElementsByClassName('ll');
        while (lines.length > 120) box.removeChild(lines[0]);
      }

      function floorMultiplier(f) { return 1 + FLOOR_GROWTH * (f - 1); }

      // POWER stats grow multiplicatively with the floor. Ratings/ratios instead
      // get a small ADDITIVE increment per level (FLAT_GROWTH) — multiplying a
      // to-hit rating or a 150% crit multiplier by the floor factor makes them
      // balloon (and crit damage would double-dip with the raw damage that
      // already scales). value = base + growth * (level - 1).
      var SCALING_STATS = ['hp', 'patt', 'matt', 'pdef', 'mdef', 'speed', 'dodge'];
      var FLAT_STATS = ['acc', 'critRate', 'critDmg', 'luck'];
      var FLAT_GROWTH = { acc: 1, critRate: 0.2, critDmg: 1, luck: 0 }; // per level
      function makeEnemy(archetype, f) {
        var m = floorMultiplier(f);
        var e = { name: archetype.name, level: f };
        SCALING_STATS.forEach(function (k) { e[k] = Math.round((archetype[k] || 0) * m); });
        FLAT_STATS.forEach(function (k) {
          var val = (archetype[k] || 0) + (FLAT_GROWTH[k] || 0) * (f - 1);
          e[k] = k === 'critRate' ? Math.round(val * 10) / 10 : Math.round(val);
        });
        e.maxhp = e.hp;
        return e;
      }

      // Damage uses the attacker's stronger offense vs the matching defense.
      // Mitigation follows: damage taken = raw * (1 - def/(def+50)).
      // Crit multiplies by critDmg/100 (e.g. 150 -> 1.5x).
      // HELP COUPLING: the '50' mitigation constant and the crit multiplier are
      // documented in stats.js (P.Def/M.Def and CritDmg `help`). Change both.
      // `defPen` (0..1) is defense ignored by the attacker (e.g. Radiant Edge).
      // Computes the hit WITHOUT applying it — the caller applies, so effects
      // like Bulwark can intercept first.
      function computeAttack(attacker, defender, defPen) {
        var physical = attacker.patt >= attacker.matt;
        var raw = physical ? attacker.patt : attacker.matt;
        var def = (physical ? defender.pdef : defender.mdef) * (1 - (defPen || 0));
        if (def < 0) def = 0;
        var dmg = raw * (50 / (def + 50));
        // Multi-crit: every full 100% crit rate is a guaranteed crit, and the
        // remainder is the chance of one more. Each crit multiplies by CritDmg,
        // so N crits = dmg * (critDmg/100)^N.
        var cr = attacker.critRate || 0;
        var crits = Math.floor(cr / 100);
        if (Math.random() * 100 < cr % 100) crits += 1;
        if (crits > 0) dmg *= Math.pow(attacker.critDmg / 100, crits);
        dmg = Math.max(1, Math.round(dmg));
        return { dmg: dmg, crits: crits, physical: physical };
      }

      // ---- Flow -------------------------------------------------------------
      function startFloor(f) {
        clearTimeout(transitionTimer);
        floor = f;
        room = 1;
        player.hp = player.maxhp;
        log('== Floor ' + f + ' ==', 'is-boss');
        TIL.saveProgress({ floor: floor });
        render();
        enterRoom();
      }

      function enterRoom() {
        combat = null;
        render();
        if (room >= ROOMS_PER_FLOOR) {
          // Boss room.
          var b = makeEnemy(pick(BOSSES), floor);
          b.isBoss = true;
          log('Room ' + room + ': BOSS — ' + b.name + ' (Lv ' + floor + ')', 'is-boss');
          startCombat(b, true);
          return;
        }
        if (Math.random() < CHEST_CHANCE) {
          log('Room ' + room + ': you find a treasure chest!', 'is-loot');
          var drops = 1 + rand(2); // 1-2
          for (var i = 0; i < drops; i++) TIL.sendReward({ items: [{ roll: 'equipment' }] });
          log('  looted ' + drops + ' item(s).', 'is-loot');
          transitionTimer = setTimeout(advance, 900);
          return;
        }
        var e = makeEnemy(pick(ENEMIES), floor);
        log('Room ' + room + ': a ' + e.name + ' appears (Lv ' + floor + ')', 'is-info');
        startCombat(e, false);
      }

      function startCombat(enemy, isBoss) {
        // Fleetfooted (alwaysFirst) overrides the speed check.
        var playerFirst = effectMap.alwaysFirst ? true : player.speed >= enemy.speed;
        combat = {
          enemy: enemy,
          isBoss: isBoss,
          activeIsPlayer: playerFirst,
          shieldReady: !!effectMap.firstHitShield, // Bulwark: one free block
        };
        var why = effectMap.alwaysFirst
          ? 'Fleetfooted — you strike first.'
          : playerFirst
          ? 'You are faster — you strike first.'
          : enemy.name + ' is faster — it strikes first.';
        log(why, 'is-info');
        render();
      }

      // Hit chance = min(100%, Accuracy / (2 * Dodge)), floored at MIN_HIT.
      // HELP COUPLING: this formula + the 10% floor are documented in stats.js
      // (Accuracy and Dodge `help`). If you change the 2x, the floor, or the
      // shape, update those help lines too.
      function hitChance(attacker, defender) {
        var d = defender.dodge || 0;
        if (d <= 0) return 1;
        return Math.max(MIN_HIT, Math.min(1, attacker.acc / (2 * d)));
      }

      function tick() {
        if (paused || !combat) return;
        var playerTurn = combat.activeIsPlayer;
        var attacker = playerTurn ? player : combat.enemy;
        var defender = playerTurn ? combat.enemy : player;

        // Accuracy vs Dodge — a miss ends the turn with no damage (and no
        // Bulwark spent, since nothing landed).
        if (Math.random() >= hitChance(attacker, defender)) {
          log(
            playerTurn ? 'You miss the ' + combat.enemy.name + '.' : combat.enemy.name + ' misses you.',
            'is-info'
          );
          combat.activeIsPlayer = !combat.activeIsPlayer;
          render();
          return;
        }

        var defPen = playerTurn ? effectMap.ignoreDefense || 0 : 0; // Radiant Edge
        var r = computeAttack(attacker, defender, defPen);

        // Bulwark: negate the first hit that would land on the player.
        if (!playerTurn && combat.shieldReady && r.dmg > 0) {
          combat.shieldReady = false;
          log('Bulwark negates the hit!', 'is-info');
        } else {
          defender.hp = Math.max(0, defender.hp - r.dmg);
          var arrow = playerTurn ? 'You hit ' + combat.enemy.name : combat.enemy.name + ' hits you';
          var critTag = r.crits > 0 ? ' (CRIT' + (r.crits > 1 ? ' x' + r.crits : '') + '!)' : '';
          log(
            arrow + ' for ' + r.dmg + critTag + (r.physical ? '' : ' [magic]'),
            r.crits > 0 ? 'is-crit' : playerTurn ? 'is-hit' : 'is-bad'
          );
        }

        if (defender.hp <= 0) {
          if (defender === combat.enemy) onEnemyDefeated();
          else onPlayerDeath();
        } else {
          combat.activeIsPlayer = !combat.activeIsPlayer;
        }
        render();
      }

      function onEnemyDefeated() {
        var enemy = combat.enemy;
        var isBoss = combat.isBoss;
        combat = null;
        var xp = Math.round((isBoss ? XP_PER_BOSS : XP_PER_ENEMY) * floor);
        TIL.sendReward({ xp: xp });
        log('Defeated ' + enemy.name + '! +' + xp + ' XP', 'is-info');
        var dropped = 0;
        if (isBoss) {
          dropped = 1 + rand(2); // boss: 1-2 guaranteed
        } else if (Math.random() < ENEMY_DROP_CHANCE) {
          dropped = 1;
        }
        for (var i = 0; i < dropped; i++) TIL.sendReward({ items: [{ roll: 'equipment' }] });
        if (dropped) log('  it dropped ' + dropped + ' item(s).', 'is-loot');
        flushUpdate(); // apply any stat/effect changes now that the fight is over
        render();
        transitionTimer = setTimeout(advance, 1000);
      }

      function onPlayerDeath() {
        combat = null;
        log('You died on Floor ' + floor + '. Back to the start of the floor.', 'is-bad');
        flushUpdate(); // apply any queued stat/effect changes before the floor resets
        render();
        transitionTimer = setTimeout(function () { startFloor(floor); }, 1600);
      }

      function advance() {
        room += 1;
        if (room > ROOMS_PER_FLOOR) {
          log('Floor ' + floor + ' cleared!', 'is-boss');
          startFloor(floor + 1);
        } else {
          enterRoom();
        }
      }

      // ---- Idle / away-time simulation --------------------------------------
      // When the window reopens after a gap, we fast-forward the REAL combat
      // engine (same computeAttack / hitChance / effect hooks) for the elapsed
      // seconds and bank the result, instead of making the player watch hours of
      // ticks. One combat turn = one second (TURN_MS), plus ~1s to enter each
      // room, matching live pacing closely enough for a fair estimate.
      var AWAY_MIN_SEC = 60; // ignore trivially short absences

      function cloneCombatant(src) {
        return {
          name: src.name, hp: src.hp, maxhp: src.maxhp,
          patt: src.patt, matt: src.matt, pdef: src.pdef, mdef: src.mdef,
          speed: src.speed, acc: src.acc, dodge: src.dodge,
          critRate: src.critRate, critDmg: src.critDmg, luck: src.luck,
        };
      }

      // Resolve one fight to the death, reusing the live combat math. Mutates
      // p.hp. Returns { died, turns } (turns = seconds the fight consumed).
      function simFight(p, enemy, fx) {
        var playerFirst = fx.alwaysFirst ? true : p.speed >= enemy.speed;
        var activeIsPlayer = playerFirst;
        var shieldReady = !!fx.firstHitShield;
        var turns = 0;
        var guard = 0;
        while (p.hp > 0 && enemy.hp > 0 && guard < 100000) {
          guard++;
          turns++;
          var attacker = activeIsPlayer ? p : enemy;
          var defender = activeIsPlayer ? enemy : p;
          if (Math.random() < hitChance(attacker, defender)) {
            var defPen = activeIsPlayer ? (fx.ignoreDefense || 0) : 0;
            var r = computeAttack(attacker, defender, defPen);
            if (!activeIsPlayer && shieldReady) shieldReady = false; // Bulwark
            else defender.hp = Math.max(0, defender.hp - r.dmg);
          }
          activeIsPlayer = !activeIsPlayer;
        }
        return { died: p.hp <= 0, turns: turns };
      }

      // Fast-forward `seconds` of dungeon runs from (startFloorNum, room 1).
      // Returns a summary of banked progress.
      function simulateAway(seconds) {
        var p = cloneCombatant(player);
        p.hp = p.maxhp;
        var f = startFloorNum;
        var r = 1;
        var reached = f;
        var totalXp = 0;
        var drops = 0;
        var deaths = 0;
        var budget = seconds;
        while (budget > 0) {
          budget -= 1; // travel into the room
          var isBossRoom = r >= ROOMS_PER_FLOOR;
          if (!isBossRoom && Math.random() < CHEST_CHANCE) {
            drops += 1 + rand(2);
            r += 1;
            if (r > ROOMS_PER_FLOOR) { f += 1; r = 1; p.hp = p.maxhp; if (f > reached) reached = f; }
            continue;
          }
          var enemy = makeEnemy(isBossRoom ? pick(BOSSES) : pick(ENEMIES), f);
          var fight = simFight(p, enemy, effectMap);
          budget -= fight.turns;
          if (fight.died) {
            deaths += 1;
            p.hp = p.maxhp;
            r = 1; // back to the start of the floor
            continue;
          }
          totalXp += Math.round((isBossRoom ? XP_PER_BOSS : XP_PER_ENEMY) * f);
          if (isBossRoom) drops += 1 + rand(2);
          else if (Math.random() < ENEMY_DROP_CHANCE) drops += 1;
          r += 1;
          if (r > ROOMS_PER_FLOOR) { f += 1; r = 1; p.hp = p.maxhp; }
          if (f > reached) reached = f;
        }
        return { reached: reached, xp: totalXp, drops: drops, deaths: deaths };
      }

      function fmtDuration(sec) {
        var h = Math.floor(sec / 3600);
        var m = Math.floor((sec % 3600) / 60);
        if (h > 0) return h + 'h ' + m + 'm';
        if (m > 0) return m + 'm';
        return sec + 's';
      }

      // Run the away simulation, bank the results in one batch, and report it.
      function runAwayReport(awayMs) {
        var sec = Math.floor((awayMs || 0) / 1000);
        if (sec < AWAY_MIN_SEC) return;
        var res = simulateAway(sec);
        var items = [];
        for (var i = 0; i < res.drops; i++) items.push({ roll: 'equipment' });
        if (res.xp > 0 || items.length > 0) {
          TIL.sendReward({ xp: res.xp, items: items });
        }
        startFloorNum = res.reached;
        TIL.saveProgress({ floor: startFloorNum });
        log('== Welcome back ==', 'is-boss');
        log(
          'Away ' + fmtDuration(sec) + ' — reached Floor ' + res.reached +
            ', +' + res.xp + ' XP, ' + res.drops + ' item(s)' +
            (res.deaths ? ', died ' + res.deaths + 'x' : ''),
          'is-loot'
        );
      }

      // ---- Render -----------------------------------------------------------
      function pct(cur, max) { return max > 0 ? Math.max(0, Math.min(100, (cur / max) * 100)) : 0; }
      function render() {
        el('loc').textContent = 'Floor ' + floor + ' · Room ' + room + '/' + ROOMS_PER_FLOOR;
        el('pname').textContent = 'You';
        el('php').textContent = Math.ceil(player.hp) + '/' + player.maxhp;
        el('pbar').style.width = pct(player.hp, player.maxhp) + '%';
        if (combat && combat.enemy) {
          var e = combat.enemy;
          el('vs').textContent = 'VS';
          el('ename').textContent = e.name + ' (Lv ' + e.level + ')';
          el('ehp').textContent = Math.ceil(e.hp) + '/' + e.maxhp;
          el('ebar').style.width = pct(e.hp, e.maxhp) + '%';
        } else {
          el('vs').textContent = '— traveling —';
          el('ename').innerHTML = '&nbsp;';
          el('ehp').innerHTML = '&nbsp;';
          el('ebar').style.width = '0%';
        }
        renderStatsPanel();
      }

      // Player-vs-enemy stat comparison, shown over the log when toggled.
      function renderStatsPanel() {
        var box = el('statspanel');
        if (!box || !box.classList.contains('show') || !player) return;
        var e = combat && combat.enemy;
        var rows = [
          ['head', '', 'You', e ? e.name + ' (Lv ' + e.level + ')' : '(no enemy)'],
          ['', 'HP', Math.ceil(player.hp) + '/' + player.maxhp, e ? Math.ceil(e.hp) + '/' + e.maxhp : '-'],
          ['', 'P.Att', player.patt, e ? e.patt : '-'],
          ['', 'M.Att', player.matt, e ? e.matt : '-'],
          ['', 'P.Def', player.pdef, e ? e.pdef : '-'],
          ['', 'M.Def', player.mdef, e ? e.mdef : '-'],
          ['', 'Speed', player.speed, e ? e.speed : '-'],
          ['', 'Acc', player.acc, e ? e.acc : '-'],
          ['', 'Dodge', player.dodge, e ? e.dodge : '-'],
          ['', 'Crit%', player.critRate + '%', e ? e.critRate + '%' : '-'],
          ['', 'CritDmg', player.critDmg + '%', e ? e.critDmg + '%' : '-'],
          ['', 'Luck', player.luck, e ? e.luck : '-'],
        ];
        var html = '<div class="sp-title">STATS</div>';
        for (var i = 0; i < rows.length; i++) {
          var r = rows[i];
          html +=
            '<div class="sp-row ' + r[0] + '"><span class="sp-l">' + r[1] +
            '</span><span class="sp-p">' + r[2] + '</span><span class="sp-e">' + r[3] + '</span></div>';
        }
        box.innerHTML = html;
      }

      function toggleStatsPanel() {
        var box = el('statspanel');
        var open = box.classList.toggle('show');
        el('statsbtn').textContent = open ? 'Hide Stats' : 'Stats';
        if (open) renderStatsPanel();
      }

      // ---- Boot -------------------------------------------------------------
      var pending = null; // { stats, effects } queued to apply after a fight
      var effectMap = {}; // { effectId: value|true } — active item effects
      var effectsList = []; // [{ id, value?, desc }] for display

      function normalizeEffects(list) {
        var map = {};
        (list || []).forEach(function (e) {
          map[e.id] = typeof e.value === 'number' ? e.value : true;
        });
        return map;
      }

      function setEffects(list) {
        effectsList = list || [];
        effectMap = normalizeEffects(effectsList);
        renderEffects();
      }

      function renderEffects() {
        var box = el('fx');
        if (!box) return;
        box.textContent = effectsList.length
          ? '* ' + effectsList.map(function (e) { return e.desc; }).join('   * ')
          : '';
      }

      function statFields(stats) {
        var s = stats || {};
        var g = function (k, d) { return typeof s[k] === 'number' ? s[k] : d; };
        return {
          maxhp: Math.max(1, Math.round(g('hp', 100))),
          patt: g('patt', 10), matt: g('matt', 10),
          pdef: g('pdef', 5), mdef: g('mdef', 5),
          speed: g('speed', 10), acc: g('acc', 90), dodge: g('dodge', 20),
          critRate: g('critRate', 5), critDmg: g('critDmg', 150), luck: g('luck', 0),
        };
      }

      function buildPlayer(stats) {
        var f = statFields(stats);
        f.name = 'You';
        f.hp = f.maxhp;
        return f;
      }

      // Apply new stats to the existing player WITHOUT healing: a higher max HP
      // just raises the cap; current HP only drops if the new max is lower.
      function applyPlayerStats(stats) {
        var f = statFields(stats);
        player.patt = f.patt; player.matt = f.matt;
        player.pdef = f.pdef; player.mdef = f.mdef;
        player.speed = f.speed; player.acc = f.acc; player.dodge = f.dodge;
        player.critRate = f.critRate; player.critDmg = f.critDmg; player.luck = f.luck;
        player.maxhp = f.maxhp;
        if (player.hp > player.maxhp) player.hp = player.maxhp;
      }

      // Updates (stats + effects) arrive from the shell whenever they change.
      // Apply immediately if idle; otherwise wait for the current fight to end.
      function receiveUpdate(payload) {
        pending = payload || {};
        if (!player) return;
        if (combat) log('(equipment change applies after this fight)', 'is-info');
        else flushUpdate();
      }

      function flushUpdate() {
        if (!pending || !player) return;
        if (pending.stats) applyPlayerStats(pending.stats);
        if (pending.effects) setEffects(pending.effects);
        pending = null;
        log(
          'Updated — HP ' + Math.ceil(player.hp) + '/' + player.maxhp +
            ', P.Att ' + player.patt + ', Speed ' + player.speed,
          'is-info'
        );
        render();
      }

      TIL.onInit(function (ctx) {
        player = buildPlayer(ctx.stats);
        setEffects(ctx.effects || []);
        startFloorNum = ctx.save && ctx.save.floor ? ctx.save.floor : 1;
        log('You enter the dungeon. (HP ' + player.maxhp + ', P.Att ' + player.patt + ', Speed ' + player.speed + ')', 'is-info');
        if (effectsList.length) {
          log('Effects: ' + effectsList.map(function (e) { return e.desc; }).join(' | '), 'is-loot');
        }
        // Bank offline progress from the time the window was closed (may bump
        // startFloorNum), then begin live play from wherever we ended up.
        runAwayReport(ctx.awayMs);
        startFloor(startFloorNum);
        if (!loopTimer) loopTimer = setInterval(tick, TURN_MS);
      });

      TIL.onMessage(function (type, payload) {
        if (type === 'pause') paused = true;
        else if (type === 'resume') paused = false;
        else if (type === 'stats') receiveUpdate(payload);
      });

      el('statsbtn').addEventListener('click', toggleStatsPanel);
      el('restart').addEventListener('click', function () {
        log('Restarting from Floor 1...', 'is-info');
        startFloor(1);
      });
      el('pause').addEventListener('click', function () {
        paused = !paused;
        el('pause').textContent = paused ? 'Resume' : 'Pause';
        log(paused ? '(paused)' : '(resumed)', 'is-info');
      });
      el('close').addEventListener('click', function () { TIL.close(); });

      // Fallback if init never arrives (shouldn't happen in the shell).
      setTimeout(function () {
        if (!player) {
          player = buildPlayer(null);
          startFloor(1);
          if (!loopTimer) loopTimer = setInterval(tick, TURN_MS);
        }
      }, 1500);
    </script>
  </body>
</html>
